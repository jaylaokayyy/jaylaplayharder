<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅遊行程規劃器 by Jayla - Travel Planner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pink: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f9a8d4',
                            400: '#f472b6',
                            500: '#ec4899',
                            600: '#db2777',
                            700: '#be185d',
                            800: '#9d174d',
                            900: '#831843',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fdf2f8;
        }
        /* 自訂捲軸 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fce7f3;
        }
        ::-webkit-scrollbar-thumb {
            background: #f472b6;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #db2777;
        }
        /* 匯出 PDF / 列印專用樣式 */
        @media print {
            header, nav, button, .no-print, #modal, #imageModal {
                display: none !important;
            }
            body {
                background-color: white !important;
                color: black !important;
                padding: 0 !important;
            }
            main {
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .bg-white {
                box-shadow: none !important;
                border: 1px solid #fbcfe8 !important;
                break-inside: avoid;
            }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">

    <!-- 頂部 Header -->
    <header class="bg-gradient-to-r from-pink-500 via-pink-400 to-rose-400 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-white/20 rounded-2xl backdrop-blur-sm">
                    <i class="fa-solid fa-plane-departure text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-wide">旅遊行程規劃器 by Jayla</h1>
                    <p class="text-xs text-pink-100">輕鬆打造屬於你的完美旅程</p>
                </div>
            </div>

            <!-- 專案與操作區塊 -->
            <div class="flex items-center gap-2 flex-wrap justify-end">
                <!-- 專案選擇 -->
                <div class="flex items-center bg-white/20 backdrop-blur-sm rounded-lg p-1">
                    <i class="fa-solid fa-folder-open text-white px-2 text-sm"></i>
                    <select id="projectSelect" onchange="switchProject()" class="bg-transparent text-white font-medium text-sm focus:outline-none pr-2 cursor-pointer border-none">
                        <!-- 動態載入專案選項 -->
                    </select>
                </div>
                <!-- 專案管理按鈕 -->
                <button onclick="addNewProject()" title="新增專案" class="px-3 py-1.5 bg-white/20 hover:bg-white/30 text-white rounded-lg text-sm font-medium transition flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">新計畫</span>
                </button>
                <button onclick="editProjectName()" title="編輯專案名稱" class="px-2.5 py-1.5 bg-white/20 hover:bg-white/30 text-white rounded-lg text-sm transition">
                    <i class="fa-solid fa-pen"></i>
                </button>
                <button onclick="deleteCurrentProject()" title="刪除專案" class="px-2.5 py-1.5 bg-white/20 hover:bg-red-500/80 text-white rounded-lg text-sm transition">
                    <i class="fa-solid fa-trash-can"></i>
                </button>

                <div class="h-5 w-[1px] bg-white/30 mx-1 hidden sm:block"></div>

                <!-- 匯出 PDF 按鈕 -->
                <button onclick="exportToPDF()" class="px-3.5 py-1.5 bg-white text-pink-600 font-semibold rounded-lg text-sm shadow-md hover:bg-pink-50 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-file-pdf"></i> 匯出 PDF
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">

        <!-- 專案標題與概覽卡片 -->
        <div class="bg-white rounded-2xl p-6 mb-6 shadow-sm border border-pink-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h2 id="currentProjectTitle" class="text-2xl font-bold text-slate-800 mb-1">未命名行程</h2>
                <p id="projectStats" class="text-sm text-slate-500">共 0 天 | 0 個行程項目</p>
            </div>

            <!-- 頂部功能區 (天數導覽與新增) -->
            <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end no-print">
                <button onclick="addDay()" class="px-4 py-2 bg-pink-500 text-white rounded-xl hover:bg-pink-600 transition shadow-sm font-medium flex items-center gap-2">
                    <i class="fa-solid fa-calendar-plus"></i> 新增天數
                </button>
            </div>
        </div>

        <!-- 天數切換 Tab 頁籤 -->
        <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-4 scrollbar-thin no-print" id="dayTabs">
            <!-- 動態生成 Day 1, Day 2 ... 按鈕 -->
        </div>

        <!-- 行程內容區 -->
        <div id="dayContentArea">
            <!-- 動態渲染行程清單 -->
        </div>

    </main>

    <!-- 頁尾 Footer -->
    <footer class="bg-white border-t border-pink-100 py-4 text-center text-xs text-pink-400 no-print mt-auto">
        <p>旅遊行程規劃器 &copy; Travel Planner by Jayla </p>
    </footer>

    <!-- 新增 / 編輯行程 Modal 彈窗 -->
    <div id="modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-pink-100">
            <!-- Modal Header -->
            <div class="p-5 border-b border-pink-100 flex justify-between items-center bg-pink-50/50 sticky top-0 bg-white z-10">
                <h3 id="modalTitle" class="text-lg font-bold text-pink-700">新增行程項目</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg w-8 h-8 flex items-center justify-center rounded-full hover:bg-pink-100 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal Form -->
            <form id="itemForm" onsubmit="handleFormSubmit(event)" class="p-5 space-y-4">
                <input type="hidden" id="editItemId">

                <!-- 項目標題 -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">行程名稱 <span class="text-red-500">*</span></label>
                    <input type="text" id="itemTitle" required placeholder="例如：景福宮韓服體驗 / 弘大甜點店" class="w-full px-3 py-2 border border-pink-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>

                <!-- 時間區間 -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">開始時間</label>
                        <input type="time" id="itemStartTime" class="w-full px-3 py-2 border border-pink-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-pink-400">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">結束時間</label>
                        <input type="time" id="itemEndTime" class="w-full px-3 py-2 border border-pink-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-pink-400">
                    </div>
                </div>

                <!-- 類別與預算 -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">類別</label>
                        <select id="itemCategory" class="w-full px-3 py-2 border border-pink-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 bg-white">
                            <option value="star">⭐ 追星</option>
                            <option value="spot">📍 景點</option>
                            <option value="food">🍽️ 美食</option>
                            <option value="transport">🚗 交通</option>
                            <option value="hotel">🏨 住宿</option>
                            <option value="shopping">🛍️ 購物</option>
                            <option value="other">📌 其他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">預估費用 / 備註金額</label>
                        <input type="text" id="itemCost" placeholder="例如：15000 或 NT$300" class="w-full px-3 py-2 border border-pink-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-pink-400">
                    </div>
                </div>

                <!-- 詳細備註 -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">詳細備註 / 事項</label>
                    <textarea id="itemNotes" rows="3" placeholder="填寫地址、預約號碼、注意事項等..." class="w-full px-3 py-2 border border-pink-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-pink-400"></textarea>
                </div>

                <!-- 相關連結 (多個) -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-bold text-slate-700">相關連結 (地圖/官網/預約單)</label>
                        <button type="button" onclick="addLinkInput()" class="text-xs text-pink-600 hover:text-pink-700 font-medium">+ 新增連結</button>
                    </div>
                    <div id="linkInputsContainer" class="space-y-2">
                        <!-- 動態生成連結輸入框 -->
                    </div>
                </div>

                <!-- 上傳照片 (最多5張) -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-bold text-slate-700">附加照片 (最多 5 張)</label>
                        <span id="photoCountBadge" class="text-xs text-slate-400">0/5</span>
                    </div>
                    
                    <!-- 本地上傳 / 貼上網址 -->
                    <div class="flex gap-2 mb-2">
                        <input type="file" id="imageFileInput" accept="image/*" multiple onchange="handleImageUpload(event)" class="hidden">
                        <button type="button" onclick="document.getElementById('imageFileInput').click()" class="px-3 py-1.5 bg-pink-100 text-pink-700 rounded-lg text-xs font-medium hover:bg-pink-200 transition">
                            <i class="fa-solid fa-upload"></i> 上傳圖片
                        </button>
                        <input type="url" id="imageUrlInput" placeholder="或貼上圖片網址 https://..." class="flex-1 px-3 py-1 border border-pink-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-pink-400">
                        <button type="button" onclick="addImageFromUrl()" class="px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg text-xs font-medium hover:bg-slate-200 transition">新增</button>
                    </div>

                    <!-- 預覽縮圖區 -->
                    <div id="imagePreviewContainer" class="flex flex-wrap gap-2 pt-1">
                        <!-- 動態插入圖片預覽 -->
                    </div>
                </div>

                <!-- Modal Footer 按鈕 -->
                <div class="flex justify-end gap-2 pt-3 border-t border-pink-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-xl text-sm hover:bg-slate-50 transition">取消</button>
                    <button type="submit" class="px-5 py-2 bg-pink-500 text-white rounded-xl text-sm font-medium hover:bg-pink-600 transition shadow-sm">儲存行程</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 圖片大圖檢視 Modal (Lightbox) -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden" onclick="closeImageModal()">
        <div class="relative max-w-4xl max-h-[90vh] flex items-center justify-center">
            <img id="lightboxImage" src="" alt="大圖預覽" class="max-w-full max-h-[85vh] rounded-lg object-contain shadow-2xl">
            <button onclick="closeImageModal()" class="absolute -top-10 right-0 text-white text-2xl hover:text-pink-300">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 全局應用程式狀態
        let appData = {
            currentProjectId: null,
            projects: []
        };

        let currentActiveDayIndex = 0; // 目前選擇的天數索引 (0 即 Day 1)
        let tempImages = []; // 彈窗內暫存的圖片陣列

        // 頁面初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            renderProjectSelect();
            renderApp();
        });

        // --- 本地儲存 (localStorage) ---
        function saveToLocalStorage() {
            localStorage.setItem('pink_travel_planner_data', JSON.stringify(appData));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('pink_travel_planner_data');
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                } catch(e) {
                    console.error('資料解析失敗', e);
                    initDefaultData();
                }
            } else {
                initDefaultData();
            }

            if (!appData.projects || appData.projects.length === 0) {
                initDefaultData();
            }

            if (!appData.currentProjectId && appData.projects.length > 0) {
                appData.currentProjectId = appData.projects[0].id;
            }
        }

        function initDefaultData() {
            const defaultId = 'proj_' + Date.now();
            appData = {
                currentProjectId: defaultId,
                projects: [
                    {
                        id: defaultId,
                        name: '首爾追星與美食小旅行',
                        days: [
                            {
                                dayNumber: 1,
                                date: '',
                                items: [
                                    {
                                        id: 'item_1',
                                        title: '抵達仁川機場 & 辦理入住',
                                        startTime: '11:30',
                                        endTime: '13:00',
                                        category: 'transport',
                                        cost: '₩10,000',
                                        notes: '搭乘 AREX 直達列車前往首爾站，再轉乘地鐵至飯店寄放行李。',
                                        links: [{ title: 'AREX 預約憑證', url: 'https://www.arex.or.kr' }],
                                        images: [],
                                        completed: false
                                    },
                                    {
                                        id: 'item_2',
                                        title: '追星快閃店 / 應援咖啡廳',
                                        startTime: '14:30',
                                        endTime: '16:30',
                                        category: 'star',
                                        cost: '₩25,000',
                                        notes: '記得領取周邊與集章禮物！展覽現場可拍照。',
                                        links: [{ title: '咖啡廳地圖導航', url: 'https://map.naver.com' }],
                                        images: [],
                                        completed: false
                                    }
                                ]
                            },
                            {
                                dayNumber: 2,
                                date: '',
                                items: []
                            }
                        ]
                    }
                ]
            };
            saveToLocalStorage();
        }

        // --- 專案管理功能 ---
        function getCurrentProject() {
            return appData.projects.find(p => p.id === appData.currentProjectId) || appData.projects[0];
        }

        function renderProjectSelect() {
            const select = document.getElementById('projectSelect');
            select.innerHTML = '';
            appData.projects.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = p.name;
                if (p.id === appData.currentProjectId) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function switchProject() {
            const select = document.getElementById('projectSelect');
            appData.currentProjectId = select.value;
            currentActiveDayIndex = 0;
            saveToLocalStorage();
            renderApp();
        }

        function addNewProject() {
            const name = prompt('請輸入新旅遊計畫名稱：', '新旅遊行程');
            if (name && name.trim() !== '') {
                const newProj = {
                    id: 'proj_' + Date.now(),
                    name: name.trim(),
                    days: [{ dayNumber: 1, date: '', items: [] }]
                };
                appData.projects.push(newProj);
                appData.currentProjectId = newProj.id;
                currentActiveDayIndex = 0;
                saveToLocalStorage();
                renderProjectSelect();
                renderApp();
            }
        }

        function editProjectName() {
            const proj = getCurrentProject();
            const newName = prompt('修改計畫名稱：', proj.name);
            if (newName && newName.trim() !== '') {
                proj.name = newName.trim();
                saveToLocalStorage();
                renderProjectSelect();
                renderApp();
            }
        }

        function deleteCurrentProject() {
            if (appData.projects.length <= 1) {
                alert('至少需保留一個計畫！');
                return;
            }
            const proj = getCurrentProject();
            if (confirm(`確定要刪除「${proj.name}」嗎？此動作無法復原。`)) {
                appData.projects = appData.projects.filter(p => p.id !== proj.id);
                appData.currentProjectId = appData.projects[0].id;
                currentActiveDayIndex = 0;
                saveToLocalStorage();
                renderProjectSelect();
                renderApp();
            }
        }

        // --- 天數 (Days) 管理 ---
        function addDay() {
            const proj = getCurrentProject();
            const newDayNum = proj.days.length + 1;
            proj.days.push({
                dayNumber: newDayNum,
                date: '',
                items: []
            });
            currentActiveDayIndex = proj.days.length - 1;
            saveToLocalStorage();
            renderApp();
        }

        function deleteDay(dayIdx) {
            const proj = getCurrentProject();
            if (proj.days.length <= 1) {
                alert('行程至少需要包含一天！');
                return;
            }
            if (confirm(`確定要刪除 Day ${dayIdx + 1} 嗎？其中的行程將一併清除。`)) {
                proj.days.splice(dayIdx, 1);
                // 重編 Day 序號
                proj.days.forEach((d, idx) => d.dayNumber = idx + 1);
                if (currentActiveDayIndex >= proj.days.length) {
                    currentActiveDayIndex = proj.days.length - 1;
                }
                saveToLocalStorage();
                renderApp();
            }
        }

        // 計算並統計當天總花費
        function calculateDayTotalCost(items) {
            if (!items || items.length === 0) return '0';

            const totals = {};
            let hasNumber = false;

            items.forEach(item => {
                if (!item.cost) return;
                const costStr = item.cost.trim();
                if (!costStr) return;

                // 提取貨幣符號/前綴（例如 ₩, NT$, $, 円）與數字
                const match = costStr.match(/^([^\d\s,]+)?\s*([\d,]+(\.\d+)?)\s*([^\d\s,]+)?$/);
                if (match) {
                    const prefix = match[1] || '';
                    const num = parseFloat(match[2].replace(/,/g, ''));
                    const suffix = match[4] || '';
                    const currency = (prefix + ' ' + suffix).trim() || '元';

                    if (!isNaN(num)) {
                        totals[currency] = (totals[currency] || 0) + num;
                        hasNumber = true;
                    }
                } else {
                    // 若無特定格式，嘗試合併數字
                    const numOnly = parseFloat(costStr.replace(/[^\d.]/g, ''));
                    if (!isNaN(numOnly)) {
                        totals['元'] = (totals['元'] || 0) + numOnly;
                        hasNumber = true;
                    }
                }
            });

            if (!hasNumber) return '0';

            // 組合多貨幣統整字串
            return Object.entries(totals)
                .map(([curr, amt]) => `${curr === '元' ? '' : curr} ${amt.toLocaleString()}`)
                .join(' + ');
        }

        // --- 核心 UI 渲染 ---
        function renderApp() {
            const proj = getCurrentProject();

            // 渲染專案標題與統計
            document.getElementById('currentProjectTitle').textContent = proj.name;
            let totalItems = 0;
            proj.days.forEach(d => totalItems += d.items.length);
            document.getElementById('projectStats').textContent = `共 ${proj.days.length} 天 | ${totalItems} 個行程項目`;

            // 渲染 Day Tabs
            const dayTabsContainer = document.getElementById('dayTabs');
            dayTabsContainer.innerHTML = '';
            proj.days.forEach((day, idx) => {
                const isActive = idx === currentActiveDayIndex;
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition flex items-center gap-2 ${
                    isActive 
                        ? 'bg-pink-500 text-white shadow-md' 
                        : 'bg-white text-slate-600 hover:bg-pink-100/60 border border-pink-100'
                }`;
                btn.onclick = () => {
                    currentActiveDayIndex = idx;
                    renderApp();
                };
                btn.innerHTML = `<span>Day ${day.dayNumber}</span> ${day.date ? `<span class="text-xs font-normal opacity-80">(${day.date})</span>` : ''}`;
                dayTabsContainer.appendChild(btn);
            });

            // 渲染目前天數的內容區塊
            const contentArea = document.getElementById('dayContentArea');
            contentArea.innerHTML = '';

            const currentDay = proj.days[currentActiveDayIndex];
            if (!currentDay) return;

            const dayTotalCostStr = calculateDayTotalCost(currentDay.items);

            const dayCard = document.createElement('div');
            dayCard.className = 'bg-white rounded-2xl p-6 shadow-sm border border-pink-100 mb-6';

            // 天數頂部 (日期編輯、當日花費統計與刪除天數)
            dayCard.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-pink-100 pb-4 mb-6">
                    <div class="flex items-center gap-3 flex-wrap">
                        <h3 class="text-xl font-bold text-pink-700">Day ${currentDay.dayNumber}</h3>
                        <input type="date" value="${currentDay.date || ''}" onchange="updateDayDate(this.value)" class="text-xs px-2.5 py-1.5 border border-pink-200 rounded-lg text-slate-600 focus:outline-none focus:ring-1 focus:ring-pink-400">
                    </div>

                    <!-- 當日花費金額統整 -->
                    <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                        <div class="bg-amber-50 text-amber-800 border border-amber-200/70 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 shadow-sm">
                            <i class="fa-solid fa-coins text-amber-600"></i>
                            <span>當日花費：<strong class="text-amber-900 font-bold">${dayTotalCostStr}</strong></span>
                        </div>

                        <div class="flex items-center gap-2 no-print">
                            <button onclick="openModalForAdd()" class="px-3 py-1.5 bg-pink-50 text-pink-600 hover:bg-pink-100 border border-pink-200 rounded-lg text-xs font-semibold transition flex items-center gap-1">
                                <i class="fa-solid fa-plus"></i> 新增行程
                            </button>
                            <button onclick="deleteDay(${currentActiveDayIndex})" class="px-2.5 py-1.5 text-slate-400 hover:text-red-500 text-xs transition" title="刪除此天">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 行程時間軸清單 -->
                <div id="itemsTimeline" class="space-y-4"></div>
            `;

            contentArea.appendChild(dayCard);

            // 渲染行程卡片
            const timeline = document.getElementById('itemsTimeline');
            if (currentDay.items.length === 0) {
                timeline.innerHTML = `
                    <div class="text-center py-12 text-pink-300">
                        <i class="fa-solid fa-calendar-day text-4xl mb-3 block"></i>
                        <p class="text-sm">這一天還沒有安排行程，點擊右上角「新增行程」開始規劃吧！</p>
                    </div>
                `;
            } else {
                currentDay.items.forEach((item) => {
                    const itemEl = createItemElement(item);
                    timeline.appendChild(itemEl);
                });
            }
        }

        function updateDayDate(dateVal) {
            const proj = getCurrentProject();
            proj.days[currentActiveDayIndex].date = dateVal;
            saveToLocalStorage();
            renderApp();
        }

        // 建立單一行程卡片 HTML
        function createItemElement(item) {
            const card = document.createElement('div');
            card.className = `p-4 rounded-xl border transition relative ${
                item.completed ? 'bg-pink-50/40 border-pink-100 opacity-75' : 'bg-white border-pink-100 shadow-sm hover:border-pink-300'
            }`;

            // 類別標籤樣式對照
            const categoryMap = {
                star: { name: '追星', class: 'bg-purple-100 text-purple-700 border-purple-200', icon: 'fa-star' },
                spot: { name: '景點', class: 'bg-rose-100 text-rose-700 border-rose-200', icon: 'fa-location-dot' },
                food: { name: '美食', class: 'bg-amber-100 text-amber-800 border-amber-200', icon: 'fa-utensils' },
                transport: { name: '交通', class: 'bg-sky-100 text-sky-700 border-sky-200', icon: 'fa-bus' },
                hotel: { name: '住宿', class: 'bg-emerald-100 text-emerald-700 border-emerald-200', icon: 'fa-bed' },
                shopping: { name: '購物', class: 'bg-pink-100 text-pink-700 border-pink-200', icon: 'fa-bag-shopping' },
                other: { name: '其他', class: 'bg-slate-100 text-slate-700 border-slate-200', icon: 'fa-bookmark' }
            };

            const cat = categoryMap[item.category] || categoryMap.other;

            // 連結列 HTML
            let linksHTML = '';
            if (item.links && item.links.length > 0) {
                linksHTML = `<div class="flex flex-wrap gap-2 mt-2">` +
                    item.links.map(l => `
                        <a href="${l.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-xs text-pink-600 bg-pink-50 hover:bg-pink-100 border border-pink-200 px-2 py-0.5 rounded-md transition">
                            <i class="fa-solid fa-link text-[10px]"></i> ${escapeHtml(l.title || '相關連結')}
                        </a>
                    `).join('') +
                    `</div>`;
            }

            // 圖片列 HTML
            let imagesHTML = '';
            if (item.images && item.images.length > 0) {
                imagesHTML = `<div class="flex flex-wrap gap-2 mt-3">` +
                    item.images.map(imgSrc => `
                        <img src="${imgSrc}" onclick="openImageModal('${imgSrc}')" class="w-16 h-16 object-cover rounded-lg border border-pink-200 cursor-pointer hover:opacity-90 transition shadow-sm">
                    `).join('') +
                    `</div>`;
            }

            // 時間區間格式化
            let timeDisplay = '';
            if (item.startTime || item.endTime) {
                timeDisplay = `<span class="text-xs font-semibold text-pink-600 bg-pink-50 px-2 py-1 rounded-md border border-pink-100"><i class="fa-regular fa-clock mr-1"></i>${item.startTime || ''}${item.startTime && item.endTime ? ' - ' : ''}${item.endTime || ''}</span>`;
            }

            card.innerHTML = `
                <div class="flex items-start justify-between gap-3">
                    <div class="flex items-start gap-3 flex-1">
                        <!-- 完成勾選框 -->
                        <button onclick="toggleItemComplete('${item.id}')" class="mt-1 text-slate-300 hover:text-pink-500 transition no-print">
                            <i class="${item.completed ? 'fa-solid fa-circle-check text-pink-500 text-lg' : 'fa-regular fa-circle text-lg'}"></i>
                        </button>
                        
                        <div class="flex-1">
                            <div class="flex flex-wrap items-center gap-2 mb-1">
                                <span class="px-2 py-0.5 rounded-md text-xs font-medium border ${cat.class}">
                                    <i class="fa-solid ${cat.icon} text-[10px] mr-1"></i>${cat.name}
                                </span>
                                ${timeDisplay}
                                <h4 class="font-bold text-slate-800 text-base ${item.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(item.title)}</h4>
                            </div>

                            ${item.cost ? `<div class="text-xs font-medium text-amber-700 mb-1"><i class="fa-solid fa-coins mr-1"></i>${escapeHtml(item.cost)}</div>` : ''}
                            ${item.notes ? `<p class="text-xs text-slate-600 whitespace-pre-line leading-relaxed mt-1 bg-slate-50/80 p-2 rounded-lg border border-slate-100">${escapeHtml(item.notes)}</p>` : ''}
                            ${linksHTML}
                            ${imagesHTML}
                        </div>
                    </div>

                    <!-- 操作按鈕 -->
                    <div class="flex items-center gap-1 no-print">
                        <button onclick="openModalForEdit('${item.id}')" class="p-1.5 text-slate-400 hover:text-pink-600 rounded-md hover:bg-pink-50 transition" title="編輯">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        <button onclick="deleteItem('${item.id}')" class="p-1.5 text-slate-400 hover:text-red-500 rounded-md hover:bg-red-50 transition" title="刪除">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                </div>
            `;

            return card;
        }

        // --- 行程增刪改查 ---
        function toggleItemComplete(itemId) {
            const proj = getCurrentProject();
            const item = proj.days[currentActiveDayIndex].items.find(i => i.id === itemId);
            if (item) {
                item.completed = !item.completed;
                saveToLocalStorage();
                renderApp();
            }
        }

        function deleteItem(itemId) {
            if (confirm('確定要刪除這個行程項目嗎？')) {
                const proj = getCurrentProject();
                const day = proj.days[currentActiveDayIndex];
                day.items = day.items.filter(i => i.id !== itemId);
                saveToLocalStorage();
                renderApp();
            }
        }

        // --- Modal 彈窗與 Form 邏輯 ---
        function openModalForAdd() {
            document.getElementById('modalTitle').textContent = '新增行程項目';
            document.getElementById('editItemId').value = '';
            document.getElementById('itemForm').reset();
            tempImages = [];
            renderImagePreviews();
            renderLinkInputs([]);
            document.getElementById('modal').classList.remove('hidden');
        }

        function openModalForEdit(itemId) {
            const proj = getCurrentProject();
            const item = proj.days[currentActiveDayIndex].items.find(i => i.id === itemId);
            if (!item) return;

            document.getElementById('modalTitle').textContent = '編輯行程項目';
            document.getElementById('editItemId').value = item.id;
            document.getElementById('itemTitle').value = item.title;
            document.getElementById('itemStartTime').value = item.startTime || '';
            document.getElementById('itemEndTime').value = item.endTime || '';
            document.getElementById('itemCategory').value = item.category || 'spot';
            document.getElementById('itemCost').value = item.cost || '';
            document.getElementById('itemNotes').value = item.notes || '';

            tempImages = item.images ? [...item.images] : [];
            renderImagePreviews();
            renderLinkInputs(item.links || []);

            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const proj = getCurrentProject();
            const day = proj.days[currentActiveDayIndex];

            const itemId = document.getElementById('editItemId').value;
            const title = document.getElementById('itemTitle').value.trim();
            const startTime = document.getElementById('itemStartTime').value;
            const endTime = document.getElementById('itemEndTime').value;
            const category = document.getElementById('itemCategory').value;
            const cost = document.getElementById('itemCost').value.trim();
            const notes = document.getElementById('itemNotes').value.trim();

            // 收集連結
            const links = [];
            const linkRows = document.querySelectorAll('.link-input-row');
            linkRows.forEach(row => {
                const t = row.querySelector('.link-title-input').value.trim();
                const u = row.querySelector('.link-url-input').value.trim();
                if (u !== '') {
                    links.push({ title: t || '連結', url: u });
                }
            });

            if (itemId) {
                // 修改
                const item = day.items.find(i => i.id === itemId);
                if (item) {
                    item.title = title;
                    item.startTime = startTime;
                    item.endTime = endTime;
                    item.category = category;
                    item.cost = cost;
                    item.notes = notes;
                    item.links = links;
                    item.images = [...tempImages];
                }
            } else {
                // 新增
                const newItem = {
                    id: 'item_' + Date.now(),
                    title,
                    startTime,
                    endTime,
                    category,
                    cost,
                    notes,
                    links,
                    images: [...tempImages],
                    completed: false
                };
                day.items.push(newItem);
            }

            saveToLocalStorage();
            closeModal();
            renderApp();
        }

        // --- 連結動態欄位 ---
        function renderLinkInputs(linksArray = []) {
            const container = document.getElementById('linkInputsContainer');
            container.innerHTML = '';
            if (linksArray.length === 0) {
                addLinkInput();
            } else {
                linksArray.forEach(l => addLinkInput(l.title, l.url));
            }
        }

        function addLinkInput(title = '', url = '') {
            const container = document.getElementById('linkInputsContainer');
            const row = document.createElement('div');
            row.className = 'flex gap-2 items-center link-input-row';
            row.innerHTML = `
                <input type="text" placeholder="名稱 (例: 地圖)" value="${escapeHtml(title)}" class="w-1/3 px-2.5 py-1.5 border border-pink-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-pink-400 link-title-input">
                <input type="url" placeholder="網址 https://..." value="${escapeHtml(url)}" class="flex-1 px-2.5 py-1.5 border border-pink-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-pink-400 link-url-input">
                <button type="button" onclick="this.parentElement.remove()" class="text-slate-400 hover:text-red-500 px-1 text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;
            container.appendChild(row);
        }

        // --- 圖片處理 (最多 5 張) ---
        function handleImageUpload(event) {
            const files = event.target.files;
            if (!files) return;

            const remainingQuota = 5 - tempImages.length;
            if (remainingQuota <= 0) {
                alert('最多只能附加 5 張照片！');
                return;
            }

            const countToUpload = Math.min(files.length, remainingQuota);

            for (let i = 0; i < countToUpload; i++) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    tempImages.push(e.target.result);
                    renderImagePreviews();
                };
                reader.readAsDataURL(files[i]);
            }
            event.target.value = '';
        }

        function addImageFromUrl() {
            const input = document.getElementById('imageUrlInput');
            const url = input.value.trim();
            if (!url) return;

            if (tempImages.length >= 5) {
                alert('最多只能附加 5 張照片！');
                return;
            }

            tempImages.push(url);
            input.value = '';
            renderImagePreviews();
        }

        function removeTempImage(idx) {
            tempImages.splice(idx, 1);
            renderImagePreviews();
        }

        function renderImagePreviews() {
            const container = document.getElementById('imagePreviewContainer');
            const countBadge = document.getElementById('photoCountBadge');
            countBadge.textContent = `${tempImages.length}/5`;

            container.innerHTML = '';
            tempImages.forEach((imgSrc, idx) => {
                const div = document.createElement('div');
                div.className = 'relative w-16 h-16 rounded-lg overflow-hidden border border-pink-200 group';
                div.innerHTML = `
                    <img src="${imgSrc}" class="w-full h-full object-cover">
                    <button type="button" onclick="removeTempImage(${idx})" class="absolute top-0 right-0 bg-red-500/80 text-white w-5 h-5 flex items-center justify-center text-[10px] hover:bg-red-600 transition">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        // --- Lightbox 圖片放大 ---
        function openImageModal(src) {
            document.getElementById('lightboxImage').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        // --- 匯出成 PDF 功能 ---
        function exportToPDF() {
            window.print();
        }

        // --- 工具函數：字串轉義防止 XSS ---
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
