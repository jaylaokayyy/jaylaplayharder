<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅遊行程規劃器 | Travel Planner by JAYLA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        },
                        fandom: {
                            100: '#fae8ff',
                            200: '#f5d0fe',
                            600: '#c026d3',
                            700: '#a21caf',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* 隱藏滾動條但保持滾動 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 時間軸連接線 */
        .timeline-line::before {
            content: '';
            position: absolute;
            top: 28px;
            bottom: 0;
            left: 19px;
            width: 2px;
            background-color: #e2e8f0;
            z-index: 0;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col selection:bg-primary-500 selection:text-white">

    <!-- 頂部導覽列 Header -->
    <header class="bg-gradient-to-r from-sky-600 via-teal-600 to-emerald-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
                <div class="flex items-center space-x-3">
                    <div class="p-2.5 bg-white/20 backdrop-blur-md rounded-2xl shadow-inner">
                        <i class="fa-solid fa-plane-departure text-2xl text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold tracking-tight">旅遊行程規劃器</h1>
                        <p class="text-xs text-sky-100 opacity-90">自由行、追星踩點、行程隨手記</p>
                    </div>
                </div>
            </div>
            
            <!-- 工具列按鈕 -->
            <div class="flex items-center space-x-2 text-sm w-full sm:w-auto justify-end">
                <button onclick="exportData()" title="匯出所有行程 JSON 檔" class="px-3 py-2 bg-white/10 hover:bg-white/20 active:bg-white/30 backdrop-blur-md rounded-xl transition duration-150 flex items-center space-x-1.5 border border-white/20">
                    <i class="fa-solid fa-file-export"></i>
                    <span class="hidden sm:inline">匯出行程</span>
                </button>
                <button onclick="document.getElementById('importFileInput').click()" title="匯入行程 JSON 檔" class="px-3 py-2 bg-white/10 hover:bg-white/20 active:bg-white/30 backdrop-blur-md rounded-xl transition duration-150 flex items-center space-x-1.5 border border-white/20">
                    <i class="fa-solid fa-file-import"></i>
                    <span class="hidden sm:inline">匯入行程</span>
                </button>
                <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">
                
                <button onclick="resetAllData()" title="重置為初始示範資料" class="px-3 py-2 bg-red-500/30 hover:bg-red-500/50 active:bg-red-500/70 backdrop-blur-md rounded-xl transition duration-150 flex items-center space-x-1.5 border border-white/20 text-red-100">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span class="hidden sm:inline">重置資料</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 sm:px-6">
        
        <!-- 專案/旅遊大標題選擇器 (Project Bar) -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex-1 flex items-center space-x-3">
                <div class="p-2 bg-sky-50 text-sky-600 rounded-xl">
                    <i class="fa-solid fa-suitcase text-xl"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center space-x-2">
                        <label class="text-xs text-slate-400 font-medium">當前旅行計畫 (專案)</label>
                        <button onclick="renameCurrentProject()" class="text-xs text-sky-600 hover:underline"><i class="fa-regular fa-pen-to-square"></i> 改名</button>
                    </div>
                    <select id="projectSelect" onchange="switchProject(this.value)" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-base font-bold rounded-xl px-3 py-1.5 focus:ring-2 focus:ring-sky-500 outline-none truncate">
                        <!-- 動態生成專案清單 -->
                    </select>
                </div>
            </div>

            <!-- 專案管理操作按鈕 -->
            <div class="flex items-center space-x-2 shrink-0 justify-end">
                <button onclick="addNewProject()" class="px-3.5 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-medium transition flex items-center space-x-1.5 shadow-sm">
                    <i class="fa-solid fa-plus"></i>
                    <span>新建行程專案</span>
                </button>
                <button onclick="deleteCurrentProject()" title="刪除此專案" class="px-3 py-2 bg-slate-100 hover:bg-red-50 text-slate-500 hover:text-red-600 rounded-xl text-xs font-medium transition">
                    <i class="fa-regular fa-trash-can"></i>
                </button>
            </div>
        </div>

        <!-- 統計數據 DashBoard -->
        <div class="grid grid-cols-3 gap-3 sm:gap-6 mb-6">
            <div class="bg-white p-3 sm:p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-3 sm:space-x-4">
                <div class="p-2.5 sm:p-3.5 bg-sky-50 text-sky-600 rounded-xl">
                    <i class="fa-regular fa-calendar-days text-lg sm:text-2xl"></i>
                </div>
                <div>
                    <div class="text-xs sm:text-sm text-slate-500 font-medium">總天數</div>
                    <div class="text-lg sm:text-2xl font-bold text-slate-800" id="statDays">0 天</div>
                </div>
            </div>

            <div class="bg-white p-3 sm:p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-3 sm:space-x-4">
                <div class="p-2.5 sm:p-3.5 bg-teal-50 text-teal-600 rounded-xl">
                    <i class="fa-solid fa-map-pin text-lg sm:text-2xl"></i>
                </div>
                <div>
                    <div class="text-xs sm:text-sm text-slate-500 font-medium">總景點/項目</div>
                    <div class="text-lg sm:text-2xl font-bold text-slate-800" id="statEvents">0 個</div>
                </div>
            </div>

            <div class="bg-white p-3 sm:p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-3 sm:space-x-4">
                <div class="p-2.5 sm:p-3.5 bg-amber-50 text-amber-600 rounded-xl">
                    <i class="fa-solid fa-sack-dollar text-lg sm:text-2xl"></i>
                </div>
                <div>
                    <div class="text-xs sm:text-sm text-slate-500 font-medium">預估總開銷</div>
                    <div class="text-lg sm:text-2xl font-bold text-slate-800" id="statCost">$0</div>
                </div>
            </div>
        </div>

        <!-- 天數切換 Tab 標籤區 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-2 sm:p-3 mb-6">
            <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar py-1" id="dayTabsContainer">
                <!-- Day Tabs 會由 JS 動態生成 -->
            </div>
        </div>

        <!-- 當天行程與標題設置區 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 sm:p-6 mb-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-100 mb-6">
                <!-- 天數名稱與日期編輯 -->
                <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 font-medium mb-1">天數標題</label>
                        <input type="text" id="dayTitleInput" onchange="updateDayMeta()" placeholder="如：Day 1 首爾追星與咖啡廳" 
                               class="w-full px-3 py-1.5 text-base font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:bg-white outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 font-medium mb-1">日期（選填）</label>
                        <input type="date" id="dayDateInput" onchange="updateDayMeta()" 
                               class="w-full px-3 py-1.5 text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:bg-white outline-none transition">
                    </div>
                </div>

                <!-- 當日功能按鈕 -->
                <div class="flex items-center space-x-2 justify-end pt-2 sm:pt-0">
                    <button onclick="openEventModal()" class="px-4 py-2 bg-sky-600 hover:bg-sky-700 active:bg-sky-800 text-white rounded-xl text-sm font-medium shadow-sm hover:shadow transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-plus"></i>
                        <span>新增行程</span>
                    </button>
                    <button onclick="deleteCurrentDay()" title="刪除此天數" class="px-3 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-sm font-medium transition">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>
            </div>

            <!-- 時間軸行程清單 -->
            <div id="eventsTimeline" class="relative space-y-4">
                <!-- 行程卡片由 JS 動態寫入 -->
            </div>
        </div>

    </main>

    <!-- 頁腳 Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
        <p>旅遊行程規劃器 &copy; <span id="year"></span> | 免費開源，資料全程存於個人瀏覽器中</p>
    </footer>

    <!-- 新增/編輯行程 Modal 彈窗 -->
    <div id="eventModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-xl max-w-xl w-full my-8 overflow-hidden transform transition-all max-h-[90vh] flex flex-col">
            <!-- Modal Header -->
            <div class="px-6 py-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center shrink-0">
                <h3 class="text-base font-bold text-slate-800" id="modalTitle">新增行程項目</h3>
                <button onclick="closeEventModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modal Form Body -->
            <form id="eventForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4 overflow-y-auto flex-1">
                <input type="hidden" id="eventId">

                <!-- 時間區間與類別 -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">開始時間 *</label>
                        <input type="time" id="eventStartTime" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">結束時間</label>
                        <input type="time" id="eventEndTime" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">類別 *</label>
                        <select id="eventCategory" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 outline-none">
                            <option value="景點">🎡 景點</option>
                            <option value="美食">🍜 美食</option>
                            <option value="交通">🚆 交通</option>
                            <option value="住宿">🏨 住宿</option>
                            <option value="購物">🛍️ 購物</option>
                            <option value="追星">🌟 追星</option>
                            <option value="其他">📌 其他</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">行程名稱/地點 *</label>
                    <input type="text" id="eventTitle" placeholder="例如：聖水洞生日應援咖啡廳" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">預估費用 (NT$)</label>
                    <input type="number" id="eventCost" placeholder="例如：350（無則留空）" min="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 outline-none">
                </div>

                <!-- 相關連結 (多項動態新增) -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-medium text-slate-600">相關連結 (如 Google 地圖、預約網址)</label>
                        <button type="button" onclick="addLinkInputRow()" class="text-xs text-sky-600 hover:text-sky-700 font-medium">
                            <i class="fa-solid fa-plus text-[10px]"></i> 新增連結
                        </button>
                    </div>
                    <div id="modalLinksContainer" class="space-y-2">
                        <!-- 動態生成連結欄位 -->
                    </div>
                </div>

                <!-- 照片上傳區 (最多5張) -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-medium text-slate-600">照片附件</label>
                        <span id="photoCounter" class="text-xs text-slate-400 font-medium">0 / 5 張</span>
                    </div>
                    
                    <!-- 新增圖片控制項 -->
                    <div class="flex items-center gap-2 mb-2">
                        <label class="cursor-pointer px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-medium transition flex items-center space-x-1 border border-slate-200">
                            <i class="fa-solid fa-upload"></i>
                            <span>上傳圖片</span>
                            <input type="file" id="modalPhotoFileInput" accept="image/*" multiple class="hidden" onchange="handlePhotoUpload(event)">
                        </label>
                        <span class="text-xs text-slate-400">或</span>
                        <input type="url" id="modalPhotoUrlInput" placeholder="貼上圖片網址 URL" class="flex-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 outline-none">
                        <button type="button" onclick="addPhotoFromUrl()" class="px-3 py-1.5 bg-sky-50 hover:bg-sky-100 text-sky-600 rounded-xl text-xs font-medium border border-sky-200 transition">新增</button>
                    </div>

                    <!-- 圖片預覽縮圖容器 -->
                    <div id="modalPhotosPreview" class="flex flex-wrap gap-2 pt-1">
                        <!-- 圖片預覽預留位置 -->
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">詳細備註 / 說明</label>
                    <textarea id="eventNotes" rows="3" placeholder="例如：應援發放時間為 12:00~16:00，展示區可免費拍照" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 outline-none"></textarea>
                </div>

                <!-- Modal Actions -->
                <div class="flex justify-end space-x-3 pt-2 shrink-0">
                    <button type="button" onclick="closeEventModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm font-medium transition">取消</button>
                    <button type="submit" class="px-5 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-sm font-medium shadow-sm transition">儲存行程</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 圖片 Lightbox 放大預覽 Modal -->
    <div id="lightboxModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4" onclick="closeLightbox()">
        <div class="relative max-w-4xl max-h-[90vh] overflow-hidden" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" class="absolute top-2 right-2 text-white/80 hover:text-white bg-black/40 hover:bg-black/60 rounded-full w-8 h-8 flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <img id="lightboxImg" src="" alt="放大照片" class="max-w-full max-h-[85vh] object-contain rounded-xl shadow-2xl mx-auto">
        </div>
    </div>

    <!-- JavaScript 邏輯處理 -->
    <script>
        // 預設範例資料（多專案結構）
        const DEFAULT_PROJECTS = [
            {
                id: "proj_1",
                name: "2026 首爾追星與美食之旅",
                days: [
                    {
                        id: "day_1",
                        title: "Day 1 抵達與首爾踩點",
                        date: "2026-11-20",
                        events: [
                            {
                                id: "evt_1",
                                startTime: "10:00",
                                endTime: "11:30",
                                title: "搭乘仁川機場快線 AREX 至弘大",
                                category: "交通",
                                cost: 250,
                                notes: "購買 T-money 卡並加值",
                                links: [
                                    { label: "AREX 官網預約", url: "https://www.arex.or.kr/" }
                                ],
                                photos: [],
                                completed: true
                            },
                            {
                                id: "evt_2",
                                startTime: "12:30",
                                endTime: "14:30",
                                title: "聖水洞偶像應援咖啡廳",
                                category: "追星",
                                cost: 350,
                                notes: "消費一杯飲品贈送限定相卡與應援海報！",
                                links: [
                                    { label: "NAVER 地圖位置", url: "https://map.naver.com/" }
                                ],
                                photos: [
                                    "https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=600&auto=format&fit=crop&q=80"
                                ],
                                completed: false
                            },
                            {
                                id: "evt_3",
                                startTime: "18:00",
                                endTime: "21:30",
                                title: "首爾奧林匹克公園（演唱會）",
                                category: "追星",
                                cost: 3800,
                                notes: "17:00 開始入場，攜帶應援棒與行動電源",
                                links: [
                                    { label: "演唱會場地資訊", url: "https://www.kspondom.or.kr/" }
                                ],
                                photos: [
                                    "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600&auto=format&fit=crop&q=80"
                                ],
                                completed: false
                            }
                        ]
                    },
                    {
                        id: "day_2",
                        title: "Day 2 景福宮與漢江公園",
                        date: "2026-11-21",
                        events: [
                            {
                                id: "evt_4",
                                startTime: "10:30",
                                endTime: "12:00",
                                title: "景福宮韓服體驗拍照",
                                category: "景點",
                                cost: 500,
                                notes: "穿韓服可免費入場景福宮",
                                links: [],
                                photos: [],
                                completed: false
                            }
                        ]
                    }
                ]
            },
            {
                id: "proj_2",
                name: "台南美食慢活小旅行",
                days: [
                    {
                        id: "day_1",
                        title: "Day 1 國華街美食踩點",
                        date: "2026-12-05",
                        events: [
                            {
                                id: "evt_5",
                                startTime: "11:00",
                                endTime: "13:00",
                                title: "牛肉湯與小卷米粉吃到飽",
                                category: "美食",
                                cost: 400,
                                notes: "提前排隊避免人潮",
                                links: [],
                                photos: [],
                                completed: false
                            }
                        ]
                    }
                ]
            }
        ];

        // 應用程式狀態 State
        let projects = [];
        let currentProjectId = "";
        let currentDayIndex = 0;
        let tempPhotos = []; // Modal 編輯中的臨時照片陣列

        // 類別 Badge 顏色標籤映射
        const CATEGORY_COLORS = {
            '景點': 'bg-sky-100 text-sky-700 border-sky-200',
            '美食': 'bg-orange-100 text-orange-700 border-orange-200',
            '交通': 'bg-indigo-100 text-indigo-700 border-indigo-200',
            '住宿': 'bg-purple-100 text-purple-700 border-purple-200',
            '購物': 'bg-pink-100 text-pink-700 border-pink-200',
            '追星': 'bg-fandom-100 text-fandom-700 border-fandom-200 shadow-sm',
            '其他': 'bg-slate-100 text-slate-700 border-slate-200'
        };

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('year').textContent = new Date().getFullYear();
            loadData();
            render();
        });

        // 載入資料 (從 localStorage)
        function loadData() {
            const saved = localStorage.getItem('travel_planner_projects');
            if (saved) {
                try {
                    projects = JSON.parse(saved);
                } catch (e) {
                    console.error('資料解析失敗，載入預設資料', e);
                    projects = JSON.parse(JSON.stringify(DEFAULT_PROJECTS));
                }
            } else {
                projects = JSON.parse(JSON.stringify(DEFAULT_PROJECTS));
            }

            if (projects.length > 0) {
                currentProjectId = projects[0].id;
            }
        }

        // 儲存資料至 localStorage
        function saveData() {
            try {
                localStorage.setItem('travel_planner_projects', JSON.stringify(projects));
                updateStats();
            } catch (e) {
                alert('儲存失敗！可能圖片檔案過大超過瀏覽器儲存限制，請嘗試刪除部分高畫質圖片。');
            }
        }

        // 取得當前專案
        function getCurrentProject() {
            return projects.find(p => p.id === currentProjectId) || projects[0];
        }

        // 核心渲染 Render
        function render() {
            if (projects.length === 0) {
                addNewProject();
                return;
            }

            renderProjectSelect();

            const curProj = getCurrentProject();
            if (!curProj.days || curProj.days.length === 0) {
                addNewDay();
                return;
            }

            if (currentDayIndex >= curProj.days.length) {
                currentDayIndex = curProj.days.length - 1;
            }

            renderTabs();
            renderCurrentDayDetails();
            updateStats();
        }

        // 渲染專案下拉清單
        function renderProjectSelect() {
            const select = document.getElementById('projectSelect');
            select.innerHTML = '';
            projects.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = p.name;
                if (p.id === currentProjectId) opt.selected = true;
                select.appendChild(opt);
            });
        }

        // 切換專案
        function switchProject(projId) {
            currentProjectId = projId;
            currentDayIndex = 0;
            render();
        }

        // 新建專案
        function addNewProject() {
            const name = prompt('請輸入新建專案/旅行大標題：', '新旅遊行程規劃');
            if (!name || !name.trim()) return;

            const newProj = {
                id: 'proj_' + Date.now(),
                name: name.trim(),
                days: [
                    {
                        id: 'day_' + Date.now(),
                        title: 'Day 1',
                        date: '',
                        events: []
                    }
                ]
            };
            projects.push(newProj);
            currentProjectId = newProj.id;
            currentDayIndex = 0;
            saveData();
            render();
        }

        // 改名當前專案
        function renameCurrentProject() {
            const curProj = getCurrentProject();
            const newName = prompt('請修改專案名稱：', curProj.name);
            if (newName && newName.trim()) {
                curProj.name = newName.trim();
                saveData();
                renderProjectSelect();
            }
        }

        // 刪除當前專案
        function deleteCurrentProject() {
            if (projects.length <= 1) {
                alert('至少需要保留一個旅遊專案！');
                return;
            }
            const curProj = getCurrentProject();
            if (confirm(`確定要刪除專案「${curProj.name}」及其所有天數與行程嗎？`)) {
                projects = projects.filter(p => p.id !== currentProjectId);
                currentProjectId = projects[0].id;
                currentDayIndex = 0;
                saveData();
                render();
            }
        }

        // 渲染 Day 標籤列
        function renderTabs() {
            const container = document.getElementById('dayTabsContainer');
            container.innerHTML = '';

            const curProj = getCurrentProject();

            curProj.days.forEach((day, index) => {
                const isActive = index === currentDayIndex;
                const tabBtn = document.createElement('button');
                tabBtn.className = `px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all duration-150 flex items-center space-x-2 ${
                    isActive 
                        ? 'bg-sky-600 text-white shadow-md' 
                        : 'bg-slate-100 hover:bg-slate-200 text-slate-600'
                }`;
                
                tabBtn.innerHTML = `
                    <span>${day.title || 'Day ' + (index + 1)}</span>
                    <span class="text-xs px-1.5 py-0.5 rounded-full ${isActive ? 'bg-sky-700 text-sky-100' : 'bg-slate-200 text-slate-500'}">${day.events ? day.events.length : 0}</span>
                `;
                tabBtn.onclick = () => {
                    currentDayIndex = index;
                    render();
                };
                container.appendChild(tabBtn);
            });

            // 新增天數按鈕
            const addDayBtn = document.createElement('button');
            addDayBtn.className = 'px-3 py-2 rounded-xl text-sm font-medium bg-emerald-50 hover:bg-emerald-100 text-emerald-600 border border-emerald-200 whitespace-nowrap transition flex items-center space-x-1';
            addDayBtn.innerHTML = `<i class="fa-solid fa-plus text-xs"></i><span>新增天數</span>`;
            addDayBtn.onclick = addNewDay;
            container.appendChild(addDayBtn);
        }

        // 渲染當日詳細內容
        function renderCurrentDayDetails() {
            const curProj = getCurrentProject();
            const currentDay = curProj.days[currentDayIndex];
            
            // 填入 Meta Input
            document.getElementById('dayTitleInput').value = currentDay.title || '';
            document.getElementById('dayDateInput').value = currentDay.date || '';

            // 按時間排序 events (使用 startTime)
            if (currentDay.events) {
                currentDay.events.sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));
            } else {
                currentDay.events = [];
            }

            const container = document.getElementById('eventsTimeline');
            container.innerHTML = '';

            if (currentDay.events.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <div class="w-16 h-16 bg-sky-50 text-sky-400 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i class="fa-solid fa-route text-2xl"></i>
                        </div>
                        <p class="text-slate-500 text-sm font-medium">今天還沒有安排任何行程喔！</p>
                        <p class="text-slate-400 text-xs mt-1">點擊上方「新增行程」按鈕開始規劃吧！</p>
                    </div>
                `;
                return;
            }

            // 加入時間軸貫穿線類別
            container.classList.add('timeline-line');

            currentDay.events.forEach((evt) => {
                const categoryClass = CATEGORY_COLORS[evt.category] || CATEGORY_COLORS['其他'];
                const card = document.createElement('div');
                card.className = `relative pl-10 transition-all duration-200 ${evt.completed ? 'opacity-55' : 'opacity-100'}`;
                
                // 時間格式顯示區間
                let timeDisplay = evt.startTime || '--:--';
                if (evt.endTime) {
                    timeDisplay += ` - ${evt.endTime}`;
                }

                // 渲染相關連結 HTML
                let linksHtml = '';
                if (evt.links && evt.links.length > 0) {
                    const linkItems = evt.links.map(link => `
                        <a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer" 
                           class="inline-flex items-center space-x-1 px-2.5 py-1 bg-white hover:bg-sky-50 text-sky-600 border border-slate-200 rounded-lg text-xs transition shadow-sm">
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            <span class="font-medium">${escapeHtml(link.label || '相關連結')}</span>
                        </a>
                    `).join('');
                    linksHtml = `<div class="flex flex-wrap gap-1.5 mt-2.5">${linkItems}</div>`;
                }

                // 渲染照片附件 HTML
                let photosHtml = '';
                if (evt.photos && evt.photos.length > 0) {
                    const photoImgs = evt.photos.map(src => `
                        <div class="relative w-16 h-16 sm:w-20 sm:h-20 rounded-xl overflow-hidden border border-slate-200 shadow-sm cursor-pointer group shrink-0" onclick="openLightbox('${src}')">
                            <img src="${src}" alt="行程照片" class="w-full h-full object-cover group-hover:scale-105 transition duration-200" onerror="this.src='https://placehold.co/200x200/e2e8f0/94a3b8?text=Image+Error'">
                            <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white">
                                <i class="fa-solid fa-magnifying-glass-plus text-xs"></i>
                            </div>
                        </div>
                    `).join('');
                    photosHtml = `<div class="flex items-center gap-2 mt-3 overflow-x-auto pb-1 no-scrollbar">${photoImgs}</div>`;
                }

                card.innerHTML = `
                    <!-- 時間軸節點 Icon -->
                    <button onclick="toggleEventComplete('${evt.id}')" title="${evt.completed ? '標記為未完成' : '標記為已完成'}" class="absolute left-2 top-3 w-6 h-6 rounded-full flex items-center justify-center border-2 z-10 transition ${
                        evt.completed 
                            ? 'bg-emerald-500 border-emerald-500 text-white' 
                            : 'bg-white border-slate-300 hover:border-sky-500 text-transparent'
                    }">
                        <i class="fa-solid fa-check text-xs"></i>
                    </button>

                    <!-- 行程主要內容卡片 -->
                    <div class="bg-slate-50 hover:bg-slate-100/80 border border-slate-200/80 rounded-2xl p-4 transition shadow-sm hover:shadow">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2">
                            <div class="flex items-center space-x-2">
                                <span class="font-mono font-bold text-sky-700 text-xs sm:text-sm bg-sky-100/80 px-2.5 py-0.5 rounded-lg flex items-center space-x-1">
                                    <i class="fa-regular fa-clock text-[11px]"></i>
                                    <span>${timeDisplay}</span>
                                </span>
                                <span class="text-xs px-2 py-0.5 rounded-md border font-medium ${categoryClass}">
                                    ${evt.category === '追星' ? '🌟 ' : ''}${evt.category}
                                </span>
                            </div>
                            
                            <!-- 操作按鈕 -->
                            <div class="flex items-center space-x-1 self-end sm:self-auto">
                                <button onclick="editEvent('${evt.id}')" class="p-1.5 text-slate-400 hover:text-sky-600 rounded-lg hover:bg-white transition" title="編輯">
                                    <i class="fa-regular fa-pen-to-square"></i>
                                </button>
                                <button onclick="deleteEvent('${evt.id}')" class="p-1.5 text-slate-400 hover:text-red-600 rounded-lg hover:bg-white transition" title="刪除">
                                    <i class="fa-regular fa-trash-can"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 標題與金額 -->
                        <div class="flex justify-between items-start gap-2">
                            <h4 class="font-bold text-slate-800 text-base ${evt.completed ? 'line-through text-slate-500' : ''}">${escapeHtml(evt.title)}</h4>
                            ${evt.cost ? `<span class="text-sm font-semibold text-emerald-600 whitespace-nowrap">NT$ ${evt.cost.toLocaleString()}</span>` : ''}
                        </div>

                        <!-- 相關連結 -->
                        ${linksHtml}

                        <!-- 照片展覽區 -->
                        ${photosHtml}

                        <!-- 備註說明 -->
                        ${evt.notes ? `
                            <p class="text-xs text-slate-500 mt-2.5 bg-white/60 p-2.5 rounded-xl border border-slate-100 whitespace-pre-line">${escapeHtml(evt.notes)}</p>
                        ` : ''}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // 更新當日名稱與日期
        function updateDayMeta() {
            const title = document.getElementById('dayTitleInput').value.trim();
            const date = document.getElementById('dayDateInput').value;

            const curProj = getCurrentProject();
            curProj.days[currentDayIndex].title = title || `Day ${currentDayIndex + 1}`;
            curProj.days[currentDayIndex].date = date;

            saveData();
            renderTabs();
        }

        // 新增一天
        function addNewDay() {
            const curProj = getCurrentProject();
            const newDayNum = curProj.days.length + 1;
            curProj.days.push({
                id: 'day_' + Date.now(),
                title: `Day ${newDayNum}`,
                date: '',
                events: []
            });
            currentDayIndex = curProj.days.length - 1;
            saveData();
            render();
        }

        // 刪除當前天數
        function deleteCurrentDay() {
            const curProj = getCurrentProject();
            if (curProj.days.length <= 1) {
                alert('專案內至少需要保留一天喔！');
                return;
            }
            if (confirm(`確定要刪除「${curProj.days[currentDayIndex].title}」及其所有行程嗎？`)) {
                curProj.days.splice(currentDayIndex, 1);
                currentDayIndex = Math.max(0, currentDayIndex - 1);
                saveData();
                render();
            }
        }

        // 切換行程完成狀態 Checkbox
        function toggleEventComplete(eventId) {
            const curProj = getCurrentProject();
            const evt = curProj.days[currentDayIndex].events.find(e => e.id === eventId);
            if (evt) {
                evt.completed = !evt.completed;
                saveData();
                renderCurrentDayDetails();
            }
        }

        // 打開 Modal 視窗（新增 / 編輯）
        function openEventModal(isEdit = false) {
            document.getElementById('modalTitle').textContent = isEdit ? '編輯行程項目' : '新增行程項目';
            document.getElementById('eventModal').classList.remove('hidden');
        }

        // 關閉 Modal 視窗
        function closeEventModal() {
            document.getElementById('eventModal').classList.add('hidden');
            document.getElementById('eventForm').reset();
            document.getElementById('eventId').value = '';
            document.getElementById('modalLinksContainer').innerHTML = '';
            tempPhotos = [];
            renderModalPhotosPreview();
        }

        // 動態新增連結輸入列 (Modal 內)
        function addLinkInputRow(label = '', url = '') {
            const container = document.getElementById('modalLinksContainer');
            const row = document.createElement('div');
            row.className = 'flex items-center gap-2 link-row';
            row.innerHTML = `
                <input type="text" placeholder="標籤 (如：Google 地圖)" value="${escapeHtml(label)}" class="w-1/3 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 outline-none link-label">
                <input type="url" placeholder="網址 (https://...)" value="${escapeHtml(url)}" class="flex-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 outline-none link-url">
                <button type="button" onclick="this.parentElement.remove()" class="p-1 text-slate-400 hover:text-red-500 transition">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            `;
            container.appendChild(row);
        }

        // 處理照片上傳 (圖片轉換 Base64)
        function handlePhotoUpload(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            if (tempPhotos.length + files.length > 5) {
                alert('一個行程項目最多只能附帶 5 張照片！');
                return;
            }

            files.forEach(file => {
                if (tempPhotos.length >= 5) return;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    tempPhotos.push(evt.target.result);
                    renderModalPhotosPreview();
                };
                reader.readAsDataURL(file);
            });

            e.target.value = '';
        }

        // 貼上 URL 新增圖片
        function addPhotoFromUrl() {
            const input = document.getElementById('modalPhotoUrlInput');
            const url = input.value.trim();
            if (!url) return;

            if (tempPhotos.length >= 5) {
                alert('一個行程項目最多只能附帶 5 張照片！');
                return;
            }

            tempPhotos.push(url);
            input.value = '';
            renderModalPhotosPreview();
        }

        // 移除編輯中的預覽圖片
        function removeTempPhoto(index) {
            tempPhotos.splice(index, 1);
            renderModalPhotosPreview();
        }

        // 渲染 Modal 內圖片縮圖與計數
        function renderModalPhotosPreview() {
            const container = document.getElementById('modalPhotosPreview');
            const counter = document.getElementById('photoCounter');
            container.innerHTML = '';

            counter.textContent = `${tempPhotos.length} / 5 張`;

            tempPhotos.forEach((src, idx) => {
                const thumb = document.createElement('div');
                thumb.className = 'relative w-16 h-16 rounded-xl overflow-hidden border border-slate-200 group';
                thumb.innerHTML = `
                    <img src="${src}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/e2e8f0/94a3b8?text=Error'">
                    <button type="button" onclick="removeTempPhoto(${idx})" class="absolute top-1 right-1 bg-black/60 hover:bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] transition">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                container.appendChild(thumb);
            });
        }

        // 編輯行程
        function editEvent(eventId) {
            const curProj = getCurrentProject();
            const evt = curProj.days[currentDayIndex].events.find(e => e.id === eventId);
            if (!evt) return;

            document.getElementById('eventId').value = evt.id;
            document.getElementById('eventStartTime').value = evt.startTime || evt.time || '';
            document.getElementById('eventEndTime').value = evt.endTime || '';
            document.getElementById('eventCategory').value = evt.category;
            document.getElementById('eventTitle').value = evt.title;
            document.getElementById('eventCost').value = evt.cost || '';
            document.getElementById('eventNotes').value = evt.notes || '';

            // 填充連結
            document.getElementById('modalLinksContainer').innerHTML = '';
            if (evt.links && evt.links.length > 0) {
                evt.links.forEach(l => addLinkInputRow(l.label, l.url));
            } else {
                addLinkInputRow();
            }

            // 填充照片
            tempPhotos = [...(evt.photos || [])];
            renderModalPhotosPreview();

            openEventModal(true);
        }

        // 刪除單一行程
        function deleteEvent(eventId) {
            if (confirm('確定要刪除這個行程嗎？')) {
                const curProj = getCurrentProject();
                curProj.days[currentDayIndex].events = curProj.days[currentDayIndex].events.filter(e => e.id !== eventId);
                saveData();
                renderCurrentDayDetails();
                renderTabs();
            }
        }

        // 表單送出 (新增或更新行程)
        function handleFormSubmit(e) {
            e.preventDefault();

            const eventId = document.getElementById('eventId').value;
            const startTime = document.getElementById('eventStartTime').value;
            const endTime = document.getElementById('eventEndTime').value;
            const category = document.getElementById('eventCategory').value;
            const title = document.getElementById('eventTitle').value.trim();
            const costVal = document.getElementById('eventCost').value;
            const cost = costVal !== '' ? parseFloat(costVal) : 0;
            const notes = document.getElementById('eventNotes').value.trim();

            // 收集相關連結
            const links = [];
            const linkRows = document.querySelectorAll('.link-row');
            linkRows.forEach(row => {
                const label = row.querySelector('.link-label').value.trim();
                const url = row.querySelector('.link-url').value.trim();
                if (url) {
                    links.push({ label: label || '相關連結', url });
                }
            });

            const curProj = getCurrentProject();

            if (eventId) {
                // 更新編輯的行程
                const evt = curProj.days[currentDayIndex].events.find(e => e.id === eventId);
                if (evt) {
                    evt.startTime = startTime;
                    evt.endTime = endTime;
                    evt.category = category;
                    evt.title = title;
                    evt.cost = cost;
                    evt.notes = notes;
                    evt.links = links;
                    evt.photos = [...tempPhotos];
                }
            } else {
                // 新增行程
                curProj.days[currentDayIndex].events.push({
                    id: 'evt_' + Date.now(),
                    startTime,
                    endTime,
                    category,
                    title,
                    cost,
                    notes,
                    links,
                    photos: [...tempPhotos],
                    completed: false
                });
            }

            saveData();
            closeEventModal();
            render();
        }

        // 開啟圖片 Lightbox
        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightboxModal').classList.remove('hidden');
        }

        // 關閉 Lightbox
        function closeLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
            document.getElementById('lightboxImg').src = '';
        }

        // 更新頂部統計數據看板
        function updateStats() {
            const curProj = getCurrentProject();
            const totalDays = curProj.days ? curProj.days.length : 0;
            let totalEvents = 0;
            let totalCost = 0;

            if (curProj.days) {
                curProj.days.forEach(day => {
                    if (day.events) {
                        totalEvents += day.events.length;
                        day.events.forEach(evt => {
                            if (evt.cost) totalCost += evt.cost;
                        });
                    }
                });
            }

            document.getElementById('statDays').textContent = `${totalDays} 天`;
            document.getElementById('statEvents').textContent = `${totalEvents} 個`;
            document.getElementById('statCost').textContent = `NT$ ${totalCost.toLocaleString()}`;
        }

        // 匯出 JSON 檔
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projects, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `all_travel_projects_${new Date().toISOString().slice(0, 10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // 匯入 JSON 檔
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        if (confirm('匯入新的行程將會覆蓋當前所有專案資料，確定要繼續嗎？')) {
                            projects = importedData;
                            currentProjectId = projects[0] ? projects[0].id : "";
                            currentDayIndex = 0;
                            saveData();
                            render();
                            alert('行程匯入成功！');
                        }
                    } else {
                        alert('JSON 檔案格式不正確！');
                    }
                } catch (err) {
                    alert('無法讀取該 JSON 檔案！');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // 清空重置所有資料
        function resetAllData() {
            if (confirm('⚠️ 警告：確定要重置所有行程專案為預設範例嗎？')) {
                localStorage.removeItem('travel_planner_projects');
                projects = JSON.parse(JSON.stringify(DEFAULT_PROJECTS));
                currentProjectId = projects[0].id;
                currentDayIndex = 0;
                saveData();
                render();
            }
        }

        // HTML 轉義工具（防止 XSS）
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
